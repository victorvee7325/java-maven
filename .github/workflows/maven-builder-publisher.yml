name: Build and Publish Java Maven Package!!

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build with Maven and Publish to Nexus
        run: mvn -B clean deploy -DaltDeploymentRepository=nexus::default::http://${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}@localhost:8081/repository/maven-prereleases/

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Attest
        uses: actions/attest-sbom@v3
        with:
          subject-path: 'target/*.jar'
          sbom-path: 'sbom.spdx.json'

      - name: Upload SBOM attestation to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file sbom.spdx.json \
            "http://localhost:8081/repository/maven-prereleases/org/sonatype/nexus/examples/java-maven/1.0.17/java-maven-1.0.17.spdx.json"

      - name: Attest build provenance
        id: attest_build_provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            target/*.jar

      - name: Download provenance attestation using gh
        id: download_provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attestation bundle is located at: ${{ steps.attest_build_provenance.outputs.bundle-path }}"
          gh attestation download target/*.jar -R victorvee7325/java-maven | tee gh-attestation.log
          PROV_FILE=$(grep -oE 'Wrote attestations to file [^ ]+' gh-attestation.log | awk '{print $5}')
          echo "provenance_file=$PROV_FILE" >> $GITHUB_OUTPUT
          FILENAME=$(basename "${{ steps.attest_build_provenance.outputs.bundle-path }}")
          echo "provenance_file_name=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload provenance attestation to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file "${{ steps.attest_build_provenance.outputs.bundle-path }}" \
            "http://localhost:8081/repository/maven-releases/org/sonatype/nexus/examples/java-maven/1.0.14/java-maven-1.0.14.jsonl"

